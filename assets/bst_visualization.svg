<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="rootGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="visitedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="880" height="480" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Title & Legend -->
  <text x="440" y="42" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">Binary Search Tree — Inorder Traversal (L → Root → R)</text>
  <text x="440" y="68" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">Sequential visit produces strictly non-decreasing sorted order</text>

  <!-- Edges -->
  <g stroke="#64748b" stroke-width="2.5" stroke-linecap="round">
    <!-- Level 0 to Level 1 -->
    <line x1="440" y1="130" x2="260" y2="200" />
    <line x1="440" y1="130" x2="620" y2="200" />

    <!-- Level 1 to Level 2 -->
    <line x1="260" y1="200" x2="160" y2="280" />
    <line x1="260" y1="200" x2="340" y2="280" />
    <line x1="620" y1="200" x2="540" y2="280" />
    <line x1="620" y1="200" x2="700" y2="280" />

    <!-- Level 2 to Level 3 -->
    <line x1="160" y1="280" x2="100" y2="360" />
    <line x1="160" y1="280" x2="210" y2="360" />
  </g>

  <!-- Traversal Order Flow Path (Curved dashed arrow line) -->
  <path d="M 100 360 Q 130 310 160 280 T 210 360 Q 235 270 260 200 T 340 280 Q 390 190 440 130 T 540 280 Q 580 230 620 200 T 700 280" 
        fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,4" stroke-opacity="0.7"/>

  <!-- Nodes & Step Badges -->
  <!-- Node 15 (Root) - Step 6 -->
  <g transform="translate(440, 130)" filter="url(#shadow)">
    <circle r="26" fill="url(#rootGrad)" stroke="#bae6fd" stroke-width="2"/>
    <text y="7" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">15</text>
    <rect x="-24" y="32" width="48" height="18" rx="9" fill="#f59e0b"/>
    <text y="45" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0f172a">Step 6</text>
  </g>

  <!-- Node 7 - Step 4 -->
  <g transform="translate(260, 200)" filter="url(#shadow)">
    <circle r="24" fill="url(#visitedGrad)" stroke="#a7f3d0" stroke-width="2"/>
    <text y="6" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">7</text>
    <rect x="-24" y="28" width="48" height="18" rx="9" fill="#f59e0b"/>
    <text y="41" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0f172a">Step 4</text>
  </g>

  <!-- Node 23 - Step 8 -->
  <g transform="translate(620, 200)" filter="url(#shadow)">
    <circle r="24" fill="url(#visitedGrad)" stroke="#a7f3d0" stroke-width="2"/>
    <text y="6" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">23</text>
    <rect x="-24" y="28" width="48" height="18" rx="9" fill="#f59e0b"/>
    <text y="41" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0f172a">Step 8</text>
  </g>

  <!-- Node 2 - Step 2 -->
  <g transform="translate(160, 280)" filter="url(#shadow)">
    <circle r="22" fill="url(#visitedGrad)" stroke="#a7f3d0" stroke-width="2"/>
    <text y="6" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">2</text>
    <rect x="-24" y="26" width="48" height="18" rx="9" fill="#f59e0b"/>
    <text y="39" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0f172a">Step 2</text>
  </g>

  <!-- Node 14 - Step 5 -->
  <g transform="translate(340, 280)" filter="url(#shadow)">
    <circle r="22" fill="url(#visitedGrad)" stroke="#a7f3d0" stroke-width="2"/>
    <text y="6" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">14</text>
    <rect x="-24" y="26" width="48" height="18" rx="9" fill="#f59e0b"/>
    <text y="39" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0f172a">Step 5</text>
  </g>

  <!-- Node 16 - Step 7 -->
  <g transform="translate(540, 280)" filter="url(#shadow)">
    <circle r="22" fill="url(#visitedGrad)" stroke="#a7f3d0" stroke-width="2"/>
    <text y="6" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">16</text>
    <rect x="-24" y="26" width="48" height="18" rx="9" fill="#f59e0b"/>
    <text y="39" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0f172a">Step 7</text>
  </g>

  <!-- Node 27 - Step 9 -->
  <g transform="translate(700, 280)" filter="url(#shadow)">
    <circle r="22" fill="url(#visitedGrad)" stroke="#a7f3d0" stroke-width="2"/>
    <text y="6" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">27</text>
    <rect x="-24" y="26" width="48" height="18" rx="9" fill="#f59e0b"/>
    <text y="39" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0f172a">Step 9</text>
  </g>

  <!-- Node 1 - Step 1 -->
  <g transform="translate(100, 360)" filter="url(#shadow)">
    <circle r="20" fill="url(#visitedGrad)" stroke="#a7f3d0" stroke-width="2"/>
    <text y="6" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">1</text>
    <rect x="-24" y="24" width="48" height="18" rx="9" fill="#f59e0b"/>
    <text y="37" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0f172a">Step 1</text>
  </g>

  <!-- Node 3 - Step 3 -->
  <g transform="translate(210, 360)" filter="url(#shadow)">
    <circle r="20" fill="url(#visitedGrad)" stroke="#a7f3d0" stroke-width="2"/>
    <text y="6" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">3</text>
    <rect x="-24" y="24" width="48" height="18" rx="9" fill="#f59e0b"/>
    <text y="37" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0f172a">Step 3</text>
  </g>

  <!-- Output Sequence Container -->
  <g transform="translate(140, 434)">
    <rect width="600" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="16" y="22" font-family="system-ui, monospace" font-size="12" font-weight="700" fill="#38bdf8">Sorted Inorder Output:</text>
    <text x="180" y="22" font-family="system-ui, monospace" font-size="13" font-weight="700" fill="#34d399">[ 1,  2,  3,  7,  14,  15,  16,  23,  27 ]</text>
  </g>
</svg>
